# .sdd/mcp-config.yaml — MCP access control theo Agent
# Version: 1.0.0
# Tham chiếu: Slide 11.6 — MCP Access Control và Tool Borrowing
#
# Cấu hình định nghĩa MCP tool mỗi Agent được phép dùng.
# Nguyên tắc: Principle of Least Privilege — chỉ cấp quyền đúng scope.
# Khi spawn sub-agent qua Claude Code, /ck:team hoặc Agent tool,
# dùng profile phù hợp để inject tool permission.

version: "1.0"

agents:
  lead-architect:
    description: "Điều phối, đọc toàn bộ context, ghi SDD artifact"
    mcp_tools:
      allowed:
        - filesystem:read       # Đọc tệp cho orchestration context
        - filesystem:write      # Chỉ ghi .sdd/ và CLAUDE.md
        - bash:read_only        # git status, git log, ls; không mutate
        - task:create           # Tạo/cập nhật task trong TASKS.md
        - task:update
        - task:list
        - send_message          # Điều phối sub-agent
      denied:
        - bash:execute          # Không trực tiếp execution; giao cho Agent phù hợp
        - database:write        # Không mutate DB
        - git:commit            # Cần review gate
        - git:push              # Cấm tuyệt đối

  backend-agent:
    description: "Developer domain/usecase; business logic thuần, không infra"
    mcp_tools:
      allowed:
        - filesystem:read       # Đọc context và Spec
        - filesystem:write      # Chỉ ghi src/domain/, src/usecase/
        - bash:execute          # Exact approved test/lint command trong Architecture Profile
        - send_message          # Báo Lead
        - task:update           # Cập nhật task được giao
      denied:
        - database:read         # Domain layer thuần, không truy cập DB trực tiếp
        - database:write
        - filesystem:write_infra
        - git:push

  infra-agent:
    description: "DB, cache và external integration"
    mcp_tools:
      allowed:
        - filesystem:read
        - filesystem:write      # Chỉ ghi src/infra/, tests/integration/
        - database:read         # Đọc schema phục vụ repository implementation
        - database:write        # Migration cần Human gate khi production
        - bash:execute          # Exact approved migration/test command
        - send_message
        - task:update
      denied:
        - database:drop         # Hard block: DROP TABLE, TRUNCATE
        - database:delete_no_where # Hard block: DELETE không WHERE
        - git:push
        - filesystem:write_domain

  interface-agent:
    description: "HTTP controller, middleware, DTO và API contract"
    mcp_tools:
      allowed:
        - filesystem:read
        - filesystem:write      # Chỉ ghi src/interface/
        - bash:execute          # Exact approved test command
        - send_message
        - task:update
      denied:
        - database:read         # Không direct DB; dùng repository qua usecase/port
        - database:write
        - git:push

  tester-agent:
    description: "Chỉ verification; đọc implementation, ghi test"
    mcp_tools:
      allowed:
        - filesystem:read       # Đọc toàn bộ source để viết test
        - filesystem:write      # Chỉ ghi tests/unit/, tests/e2e/
        - bash:execute          # Exact approved test/coverage command
        - send_message
        - task:update
      denied:
        - filesystem:write_src  # Không sửa src/
        - database:write
        - git:commit
        - git:push

global_denied:
  - filesystem:read_secrets     # .env, *.pem, *.key, secrets/
  - bash:rm_force               # rm -rf chưa có confirmation
  - git:push_force              # Force push mọi branch
  - git:push_main               # Push trực tiếp main/master/production
  - network:external_post       # External API call chưa được ủy quyền
  - eval_execution              # eval(), Function() constructor

# Tool borrowing protocol: sub-agent gửi request cho Lead; Lead kiểm tra
# global_denied và justification. Nếu hợp lệ, Lead tự thực hiện thao tác một lần,
# không cấp permanent access. Yêu cầu global_denied phải escalate Human Director.
tool_borrowing:
  process: "request_via_lead"
  max_borrow_duration: "single_task"
  requires_justification: true
  global_denied_override: "human_director_only"

audit:
  log_path: ".sdd/reviews/mcp-audit-{date}.log"
  log_events:
    - tool_denied          # Agent thử dùng tool bị cấm
    - tool_borrowed        # Lead thực hiện thay mặt sub-agent
    - global_denied_attempt # Critical; luôn báo Human
  alert_on: "global_denied_attempt"
